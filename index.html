<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>حصنك | دليلك للصلاة والأذكار </title>
    <meta name="description"
        content="تطبيق حصنك - أذكار الصباح والمساء ومواقيت الصلاة. حصنك اليومي مع خاصية العمل بدون انترنت.">
    <meta name="theme-color" content="#423E87">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حصنك">

    <!-- Preconnect to font domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Critical Fonts - only essential for initial render (Cairo for UI) -->
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
    
    <!-- Non-critical font (Amiri) - defer loading -->
    <link rel="prefetch" as="style"
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
    
    <!-- Fallback for non-JS browsers -->
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
    </noscript>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon / Icons -->
    <link rel="icon" type="image/png" href="hesnok_logo1.png">
    <link rel="apple-touch-icon" href="hesnok_logo1.png">

    <!-- Preload critical logo image -->
    <link rel="preload" as="image" href="hesnok_logo1.png">

    <!-- Prefetch azkar data for faster tab switching -->
    <link rel="prefetch" as="fetch" href="data/azkar-data.js" crossorigin>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/style.css">

    <!-- Critical Inline CSS for Loading State -->
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --text-primary: #0F172A;
            --bg-main: #F8FAFC;
        }
        .dark {
            --text-primary: #F8FAFC;
            --bg-main: #020617;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
        }
        .loading-skeleton {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-logo {
            width: 80px;
            height: 80px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>

<body>
    <!-- Loading Skeleton (visible immediately while JS loads) -->
    <div id="root">
        <div class="loading-skeleton">
            <img src="hesnok_logo1.png" alt="حصنك" class="loading-logo" width="80" height="80">
        </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
        // Hide loading skeleton once React takes over
        (function() {
            const hideLoading = () => {
                const root = document.getElementById('root');
                if (root && root.querySelector('.loading-skeleton')) {
                    const skeleton = root.querySelector('.loading-skeleton');
                    skeleton.style.opacity = '0';
                    skeleton.style.transition = 'opacity 0.3s';
                    setTimeout(() => skeleton.remove(), 300);
                }
            };
            
            // Hide immediately when DOM is ready (faster than requestIdleCallback for FCP)
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', hideLoading);
            } else {
                hideLoading();
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js');
                });
            }
        })();
    </script>
</body>

</html>
